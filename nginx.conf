server {
    listen 5173 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/igroceh.pem;
    ssl_certificate_key /etc/nginx/certs/igroceh-key.pem;

    root /usr/share/nginx/html;
    index index.html;

    # file names of built assets contain content hash, so they can be cached forever
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}
